services:
  nexus:
    image: nexus:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - '${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      SEARXNG_URL: '${SEARXNG_URL:-https://search.asynched.tech/}'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
